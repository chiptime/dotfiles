# Global project annotations — human-maintained layer for scripts/projects-dashboard.sh
#
# One block per repo (basename). Keys: scope, status, desc, next.
# status: active | proposal | paused | closed | cold
#
# CONVENTION (session-close): after finishing meaningful work on a project,
# the agent updates that project's status/desc/next here and reruns `projects`.
# Bruno only edits this file for scope decisions (activate/pause/close/triage).
# Repos discovered by the sweep but absent here show up under "Unclassified".
# Never put secrets in this file.

