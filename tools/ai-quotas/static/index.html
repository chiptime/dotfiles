<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Quotas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #0d1117; color: #e6edf3;
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .actions { display: flex; align-items: center; gap: 12px; }
  #btn-refresh {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  #btn-refresh:hover:not(:disabled) {
    background: #30363d;
    border-color: #8b949e;
    color: #ffffff;
  }
  #btn-refresh:disabled {
    opacity: .6;
    cursor: not-allowed;
  }
  .spin {
    display: inline-block;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }
  .last-updated { color: #484f58; font-size: 12px; }
  #ranking { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  #ranking .rank-label { color: #8b949e; font-size: 12px; }
  #closes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  #closes .rank-label { color: #484f58; font-size: 12px; }
  .closechip { display: inline-flex; align-items: baseline; gap: 5px; border: 1px solid #21262d;
               border-radius: 999px; padding: 2px 10px; font-size: 11px; color: #8b949e; }
  .closechip b { font-weight: 600; color: #c9d1d9; }
  .spark { vertical-align: middle; opacity: .9; margin-left: 4px; }
  #btn-workday, #btn-moreinfo, #btn-autorefresh { background: none; border: 1px solid #30363d; border-radius: 6px;
                               color: #8b949e; font-size: 11px; padding: 2px 8px; cursor: pointer; margin-left: 10px; }
  #btn-workday.on, #btn-moreinfo.on, #btn-autorefresh.on { color: #3fb950; border-color: #3fb950; }
  /* Extra detail (toca/cierra, notes) stays hidden unless "más info" is on. */
  body:not(.moreinfo) .xinfo { display: none; }
  .chip { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid #30363d;
          border-radius: 999px; padding: 4px 12px; font-size: 12px; color: #c9d1d9; }
  .chip b { font-weight: 600; }
  .chip .w { color: #8b949e; }
  .chip.best { border-color: #3fb950; }
  .chip.best b, .chip.best .w { color: #3fb950; }
  .chip.ahead { border-color: #d29922; }
  .chip.ahead b, .chip.ahead .w { color: #d29922; }
  .mini { position: relative; display: inline-block; width: 48px; height: 4px;
          border-radius: 2px; background: #30363d; overflow: hidden; vertical-align: middle; }
  .mini > i { display: block; height: 100%; border-radius: 2px; }
  .mini > i.fill.green { background: #3fb950; }
  .mini > i.fill.amber { background: #d29922; }
  .mini > i.fill.red { background: #f85149; }
  .mini > i.tick { position: absolute; top: 0; left: 0; width: 2px; height: 100%;
                   background: #e6edf3; opacity: .75; }
  #groups { display: flex; flex-direction: row; gap: 20px; align-items: flex-start;
            overflow-x: auto; padding-bottom: 10px; }
  .group { flex: 0 0 auto; width: min(270px, 85vw); }
  .group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
                flex-wrap: wrap; }
  .group-title { font-size: 15px; font-weight: 600; }
  .group-sub { color: #8b949e; font-size: 12px; }
  .sub-head { color: #8b949e; font-size: 11px; margin: 12px 0 8px;
              text-transform: uppercase; letter-spacing: .05em; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; }
  .card.stale { opacity: .5; }
  .card.done { opacity: .45; filter: grayscale(1); }
  .card.missing { background: transparent; border: 1px dashed #484f58; }
  .card .title { font-weight: 600; font-size: 14px; }
  .qrow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .qval { font-weight: 700; }
  .badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .badge.badge-click { cursor: pointer; user-select: none; }
  .badge.badge-click::after { content: ' \25B8'; font-size: 10px; opacity: .7; }
  .badge.badge-click.open::after { content: ' \25BE'; }
  .reset-detail { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .reset-detail.hidden { display: none; }
  .reset-detail .badge { opacity: .8; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid #30363d; color: #8b949e; }
  .badge.state-error { border-color: #f85149; color: #f85149; background: rgba(248, 81, 73, .1); }
  .badge.state-stale { border-color: #d29922; color: #d29922; }
  .badge.state-done { border-color: #8b949e; color: #8b949e; background: rgba(139, 148, 158, .08); }
  /* Incident badge (provider status page): subtle colored dot; red text only for critical. */
  .status-badge { display: inline-flex; align-items: center; gap: 5px; }
  .status-badge .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
  .status-badge.sev-maintenance .dot { background: #58a6ff; }
  .status-badge.sev-minor .dot { background: #d29922; }
  .status-badge.sev-major .dot, .status-badge.sev-critical .dot { background: #f85149; }
  .status-badge.sev-critical { border-color: #f85149; color: #f85149; }
  .chip.done { opacity: .45; }
  .chip.stalemark { border-style: dashed; }
  .note { color: #8b949e; font-size: 11px; margin-top: 4px; word-break: break-word; }
  .group.exhausted .group-title { color: #8b949e; }
  .big { font-size: 30px; font-weight: 700; margin-top: 12px; }
  .bar { margin-top: 8px; height: 4px; border-radius: 2px; background: #30363d; overflow: hidden; position: relative; }
  .bar > i { display: block; height: 100%; border-radius: 2px; }
  .bar > i.green { background: #3fb950; }
  .bar > i.amber { background: #d29922; }
  .bar > i.red { background: #f85149; }
  .bar > i.tick { position: absolute; top: 0; left: 0; width: 2px; height: 100%;
                  background: #e6edf3; opacity: .75; }
  .resets { color: #8b949e; font-size: 12px; margin-top: 8px; }
  .detail { color: #f85149; font-size: 12px; margin-top: 8px; word-break: break-word; }
  .nodata { color: #8b949e; margin-top: 12px; }
  /* Cost panel (OpenCode spend): full-width card under the provider groups. */
  .cost-panel { margin-top: 26px; width: 100%; max-width: 920px; }
  .cost-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cost-days { display: flex; align-items: flex-end; gap: 2px; height: 56px; margin-top: 10px; }
  .cost-days i { flex: 1 1 auto; min-width: 2px; background: #4fb6c3; opacity: .85;
                 border-radius: 2px 2px 0 0; cursor: default; }
  .cost-days i.zero { background: #21262d; }
  .prov-row { margin-top: 10px; }
  .prov-head { cursor: pointer; }
  .prov-head:hover .title { color: #58a6ff; }
  .cdetail { margin: 6px 0 2px 12px; border-left: 2px solid #21262d; padding-left: 10px; }
  .cdetail.hidden { display: none; }
  .range-btn { background: none; border: 1px solid #30363d; border-radius: 999px;
               color: #8b949e; font-size: 11px; padding: 2px 10px; cursor: pointer; margin-left: 6px; }
  .range-btn.on { color: #3fb950; border-color: #3fb950; }
  .split-line { color: #8b949e; font-size: 11px; margin-top: 8px; }
  .split-line b.pagado { color: #f85149; }
  .split-line b.cubierto { color: #3fb950; }
  footer { margin-top: 28px; color: #484f58; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AI Quotas</h1>
  <div class="actions">
    <span id="last-updated" class="last-updated" title="Time of the last successful data load"></span>
    <button id="btn-refresh" onclick="triggerRefresh()">
      <span id="btn-icon">↻</span> <span id="btn-text">Recargar</span>
    </button>
  </div>
</header>
<div id="ranking"></div>
<div id="closes"></div>
<div id="groups"></div>
<div id="costs"></div>
<footer>AI Quotas · local only · <span id="refreshed">—</span><button id="btn-moreinfo" onclick="toggleMoreInfo()"></button><button id="btn-workday" onclick="toggleWorkday()"></button><button id="btn-autorefresh" onclick="toggleAutoRefresh()"></button></footer>
<script>
'use strict';

const SYMBOLS = { EUR: '€', USD: '$', CNY: '¥' };

// Provider group order (known pull/file ids first, unknown ones after, by name).
const ORDER = ['claude', 'zai', 'chatgpt', 'opencode', 'gemini', 'deepseek'];

// Relative subscription capacity, used ONLY as a ranking tie-breaker (at
// equal pace, the bigger sub wastes more money). Hidden from the UI: pace
// itself needs no weights. Claude = 1, zai = 20x, tune the rest to taste.
const CAPACITY = { claude: 1, zai: 20, chatgpt: 1, opencode: 1, gemini: 1 };

// Window used for cross-sub comparison (the only one all coding subs share).
const COMPARISON_LABEL = 'weekly';

// History state (loaded from /api/history on each render).
let HISTORY = [];
// Incident state per provider from /api/status (server caches 10 min).
let STATUS = {};
let COSTS = {};
// Learned window durations: "provider|label" -> observed ms (median of
// consecutive reset gaps). Falls back to the tier constants until enough
// resets have been observed.
let LEARNED_DUR = {};
// Workday-aware pace (E13): count only Mon-Fri hours inside windows.
const workday = { on: localStorage.getItem('workdayPace') === '1' };

// Standard window labels form the main row of a group; everything else
// (3P variants, generic token limits, balances...) falls into "Otras cuotas".
// "monthly" matches both OpenCode "Monthly" and Z.ai "MCP monthly".
function isMainLabel(label) {
  const l = String(label || '').toLowerCase();
  return l === '5h window' || l === 'weekly' || l.endsWith('monthly');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Window tier: hora -> semana -> mes -> sin ventana.
function windowTier(label) {
  const l = String(label || '').toLowerCase();
  if (l.includes('5h') || l.includes('hour')) return 0;
  if (l.includes('week')) return 1;
  if (l.includes('month') || l.includes('mes')) return 2;
  return 3;
}

// One sub's weekly pace: pace = used% / elapsed window % (unit-free — no
// weights needed to know if you are behind). `cap` comes along only as the
// ranking tie-breaker. Stale records still count (marked, dashed) so the
// ranking does not flicker on transient pull blips; `stale` flags them and
// `age` carries seconds since their fetch. Null when not computable (no
// reset, no weekly, or window just started: elapsed < 2%).
function paceView(provider, recs) {
  const cap = CAPACITY[provider];
  if (!cap) return null;
  const w = recs.find(r => String(r.label || '').toLowerCase() === COMPARISON_LABEL);
  if (!w || (w.state !== 'ok' && w.state !== 'stale')) return null;
  if (typeof w.used_percent !== 'number') return null;
  const exp = paceExpected(w);
  if (exp == null || exp < 0.02) return null;
  return {
    pace: w.used_percent / 100 / exp, cap,
    left: new Date(w.resets_at) - Date.now(),
    usedPct: w.used_percent, tocaPct: exp * 100,
    stale: w.state === 'stale', age: w.age_seconds || 0,
  };
}

// Expected used fraction [0..1] for a window card, from its tier duration
// (or the learned one) and time left to reset (linear pace). Stale records
// keep their tick — the data degrades gracefully instead of vanishing.
const WINDOW_DUR_MS = { 0: 5 * 3600e3, 1: 7 * 86400e3, 2: 30 * 86400e3 };
function windowDurMs(r) {
  return LEARNED_DUR[r.provider + '|' + r.label] || WINDOW_DUR_MS[windowTier(r.label)];
}
function paceExpected(r) {
  if ((r.state !== 'ok' && r.state !== 'stale') || !r.resets_at) return null;
  const dur = windowDurMs(r);
  if (!dur) return null;
  const end = new Date(r.resets_at).getTime();
  const start = end - dur;
  const now = Date.now();
  const frac = workday.on ? workElapsedFraction(start, end, now) : (now - start) / dur;
  return Math.min(1, Math.max(0, frac));
}

// Weekday (Mon-Fri) hours between a and b, in ms.
function workHoursBetween(a, b) {
  let ms = 0;
  const d = new Date(a);
  d.setHours(0, 0, 0, 0);
  while (d.getTime() < b) {
    const dayStart = d.getTime();
    const dayEnd = dayStart + 86400e3;
    if (d.getDay() !== 0 && d.getDay() !== 6) {
      ms += Math.max(0, Math.min(b, dayEnd) - Math.max(a, dayStart));
    }
    d.setDate(d.getDate() + 1);
  }
  return ms;
}

// Elapsed fraction counting only work hours (fallback: wall clock).
function workElapsedFraction(start, end, now) {
  const total = workHoursBetween(start, end);
  if (total <= 0) return (now - start) / (end - start);
  return Math.min(1, Math.max(0, workHoursBetween(start, Math.min(now, end)) / total));
}

// Learn real window durations from observed consecutive resets in history.
function learnDurations(hist) {
  const resets = new Map();
  for (const h of hist) {
    if (!h.resets_at || !h.label) continue;
    const key = h.provider + '|' + h.label;
    const t = Date.parse(h.resets_at);
    if (!isFinite(t)) continue;
    const arr = resets.get(key) || [];
    if (!arr.length || arr[arr.length - 1] !== t) arr.push(t);
    resets.set(key, arr);
  }
  const out = {};
  for (const [key, list] of resets) {
    const durs = [];
    for (let i = 1; i < list.length; i++) {
      const d = list[i] - list[i - 1];
      if (d > 4 * 3600e3 && d < 35 * 86400e3) durs.push(d); // sane bounds
    }
    if (durs.length) {
      durs.sort((a, b) => a - b);
      out[key] = durs[Math.floor(durs.length / 2)]; // median
    }
  }
  return out;
}

// Per provider: final used% of the last COMPLETED weekly window in history.
function weeklyCloses(hist) {
  const wins = new Map();
  for (const h of hist) {
    if (String(h.label || '').toLowerCase() !== 'weekly' || !h.resets_at) continue;
    const r = Date.parse(h.resets_at);
    if (!isFinite(r)) continue;
    if (!wins.has(h.provider)) wins.set(h.provider, new Map());
    const w = wins.get(h.provider);
    const seen = w.get(r) ?? -1;
    if (typeof h.used_percent === 'number') w.set(r, Math.max(seen, h.used_percent));
    else if (!w.has(r)) w.set(r, seen);
  }
  const now = Date.now();
  const out = [];
  for (const [provider, w] of wins) {
    const done = [...w.entries()].filter(([r]) => r <= now).sort((a, b) => a[0] - b[0]);
    const last = done[done.length - 1];
    if (last && last[1] >= 0) out.push({ provider, close: last[1] });
  }
  return out;
}

// Ritmo series for one provider's weekly window, from history snapshots.
function ritmoSeries(provider, hist, limit = 14) {
  const out = [];
  for (const h of hist) {
    if (h.provider !== provider || String(h.label || '').toLowerCase() !== 'weekly') continue;
    if (typeof h.used_percent !== 'number' || !h.resets_at || !h.ts) continue;
    const end = Date.parse(h.resets_at), ts = Date.parse(h.ts);
    const dur = LEARNED_DUR[provider + '|Weekly'] || 7 * 86400e3;
    const start = end - dur;
    const frac = workday.on ? workElapsedFraction(start, end, ts) : (ts - start) / dur;
    if (frac > 0.02 && frac <= 1) out.push({ ts, ritmo: h.used_percent / 100 / frac });
  }
  return out.slice(-limit);
}

function sparkline(series) {
  if (series.length < 2) return '';
  const w = 56, hgt = 14;
  const max = Math.max(1.2, ...series.map(p => p.ritmo));
  const y100 = hgt - (1 / max) * hgt;
  const pts = series.map((p, i) =>
    (i / (series.length - 1) * w).toFixed(1) + ',' + (hgt - Math.min(1, p.ritmo / max) * hgt).toFixed(1)
  ).join(' ');
  return '<svg class="spark" width="' + w + '" height="' + hgt + '" viewBox="0 0 ' + w + ' ' + hgt + '">' +
    '<line x1="0" y1="' + y100.toFixed(1) + '" x2="' + w + '" y2="' + y100.toFixed(1) + '" stroke="#30363d" stroke-width="1"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="#58a6ff" stroke-width="1.5"/></svg>';
}

// Within a provider: main quotas first (hora -> semana -> mes), then
// "otras" quotas keeping the same internal order, label as tiebreaker.
function cmpRecords(a, b) {
  const la = String(a.label || ''), lb = String(b.label || '');
  const m = (isMainLabel(la) ? 0 : 1) - (isMainLabel(lb) ? 0 : 1);
  if (m) return m;
  const t = windowTier(la) - windowTier(lb);
  if (t) return t;
  return la.localeCompare(lb);
}

function ago(sec) {
  const m = Math.floor(sec / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d > 0) return d + 'd ' + (h % 24) + 'h ago';
  if (h > 0) return h + 'h ' + (m % 60) + 'm ago';
  if (m > 0) return m + 'm ago';
  return 'just now';
}

function until(ms) {
  const abs = Math.max(0, ms);
  const d = Math.floor(abs / 86400000);
  const h = Math.floor(abs % 86400000 / 3600000);
  const m = Math.floor(abs % 3600000 / 60000);
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

function barClass(p) { return p > 90 ? 'red' : p >= 70 ? 'amber' : 'green'; }

// Human wording per severity (statuspage vocabulary) for badge and tooltip.
const SEVERITY_LABELS = {
  minor: 'degraded performance',
  major: 'partial outage',
  critical: 'major outage',
  maintenance: 'under maintenance',
};

// Incident badge for a provider group: colored dot + short label; the
// tooltip carries the page's own description. Nothing renders while every
// component is operational (or the provider has no status mapping), so the
// dashboard stays calm by default.
function statusBadge(provider) {
  const st = STATUS[provider];
  if (!st || !st.indicator || st.indicator === 'none') return '';
  const label = SEVERITY_LABELS[st.indicator] || st.indicator;
  const tip = provider + ' status: ' + label +
    (st.summary ? ' — ' + st.summary : '') +
    (st.stale ? ' (stale data)' : '');
  return '<span class="badge status-badge sev-' + esc(st.indicator) + '" title="' + esc(tip) + '">' +
    '<i class="dot"></i>' + esc(label) + '</span>';
}

// Plain expiry date used by reset badges ("20 Sep", viewer's locale, no time).
function resetExpText(date) {
  return date.toLocaleDateString([], { day: '2-digit', month: 'short' });
}

// Earned usage-limit resets badge text: "3 resets", "1 reset · exp 01 Oct".
// Expiry (a plain date, viewer's locale) is omitted when unknown;
// "0 resets" only shows when the provider really reports zero.
function resetsBadgeText(rc) {
  const n = Number(rc && rc.available) || 0;
  let text = n + (n === 1 ? ' reset' : ' resets');
  const exp = rc && rc.expires_at ? new Date(rc.expires_at) : null;
  if (exp && !isNaN(exp)) {
    text += ' · exp ' + resetExpText(exp);
  }
  return text;
}

// Muted per-credit badges: each earned reset lists its own expiry
// ("Full reset · exp 20 Sep"; just "exp 20 Sep" when the provider gives no
// title). Credits without any title or parsable expiry are skipped.
function resetCreditBadges(credits) {
  return (Array.isArray(credits) ? credits : []).map(c => {
    const exp = c && c.expires_at ? new Date(c.expires_at) : null;
    const expText = exp && !isNaN(exp) ? resetExpText(exp) : null;
    const title = c && c.title ? String(c.title) : null;
    if (!title && !expText) return '';
    const label = title
      ? (expText ? title + ' · exp ' + expText : title)
      : 'exp ' + expText;
    return '<span class="badge">' + esc(label) + '</span>';
  }).join('');
}

// Show/hide the per-credit detail list attached to a reset summary badge.
// The detail container is the .reset-detail div right after the badge row.
function toggleResetDetail(badge) {
  const detail = badge.closest('.badges') && badge.closest('.badges').nextElementSibling;
  if (!detail || !detail.classList.contains('reset-detail')) return;
  const open = detail.classList.toggle('hidden');
  badge.classList.toggle('open', !open);
  badge.setAttribute('aria-expanded', String(!open));
}

// A quota is exhausted ("acabada") when its window is ~full (>= 99.5 catches
// unrounded values like 99.73) or a balance is ~zero.
function exhausted(r) {
  if (r.state !== 'ok') return false;
  if (r.kind === 'balance') return r.limit != null && r.limit <= 0.005;
  return typeof r.used_percent === 'number' && r.used_percent >= 99.5;
}

// Coarse-to-fine exhaustion cascade over the MAIN quotas: monthly binds the
// whole sub even if weekly looks free, then weekly, then the 5h window.
// Returns the blocking tier ('mensual' | 'semanal' | '5h') or null.
function bindingTier(mainRecs) {
  const tiers = [['mensual', 2], ['semanal', 1], ['5h', 0]];
  for (const [name, tier] of tiers) {
    if (mainRecs.some(r => windowTier(r.label) === tier && exhausted(r))) return name;
  }
  return null;
}

// Tier depth of a binding name ('5h' -> 0, 'semanal' -> 1, 'mensual' -> 2).
const TIER_DEPTH = { '5h': 0, semanal: 1, mensual: 2 };

// `blockedBy` (optional, tier name) grays an otherwise-alive card because a
// coarser main window is exhausted — the sub cannot serve this quota either.
function card(r, blockedBy) {
  const fallback = r.state === 'missing' ? 'Sin datos' : r.state === 'error' ? 'Error' : 'Cuota';
  const title = '<div class="title">' + esc(r.label || fallback) + '</div>';
  const done = exhausted(r);
  const muted = done || (blockedBy && r.state === 'ok');
  let badges = r.source ? '<span class="badge">' + esc(r.source) + '</span>' : '';
  let resetDetailHtml = '';
  if (r.reset_credits) {
    // Per-credit rows stay hidden behind the summary badge: clicking it
    // toggles the detail list (rendered right after the badge row).
    resetDetailHtml = resetCreditBadges(r.reset_credits.credits);
    const summary = '<span class="badge" title="Earned usage-limit resets available after hitting a cap">' +
      esc(resetsBadgeText(r.reset_credits)) + '</span>';
    badges += resetDetailHtml
      ? '<span class="badge badge-click" role="button" aria-expanded="false" ' +
        'title="Show per-reset expiry detail" onclick="toggleResetDetail(this)">' +
        esc(resetsBadgeText(r.reset_credits)) + '</span>'
      : summary;
  }
  if (done) badges += '<span class="badge state-done">agotada</span>';
  else if (muted) badges += '<span class="badge state-done">bloqueada · ' + esc(blockedBy) + '</span>';
  let body = '';
  let note = '';
  if (r.detail && r.state !== 'error') note = '<div class="note xinfo">' + esc(r.detail) + '</div>';

  if (r.state === 'missing') {
    body = '<div class="nodata">sin datos' +
      (r.detail ? ' · ' + esc(r.detail) : '') + '</div>';
  } else if (r.state === 'error') {
    badges += '<span class="badge state-error">error</span>';
    if (r.detail) body = '<div class="detail">' + esc(r.detail) + '</div>';
  } else {
    if (r.state === 'stale') {
      badges += '<span class="badge state-stale">stale · seen ' + ago(r.age_seconds || 0) + '</span>';
    }
    if (r.kind === 'balance') {
      const cur = r.currency || '';
      const sym = SYMBOLS[cur];
      // Spend-style balances carry used + cap (e.g. Claude extra usage).
      if (r.used != null && r.limit != null) {
        const fmt = v => Number(v).toFixed(2);
        body = '<div class="big">' +
          (sym ? sym : cur ? cur + ' ' : '') + fmt(r.used) + ' / ' + fmt(r.limit) + '</div>';
      } else {
        const amount = (r.limit == null ? 0 : r.limit).toFixed(2);
        body = '<div class="big">' + (sym ? sym + amount : cur ? cur + ' ' + amount : amount) + '</div>';
      }
    } else if (r.unit === 'requests' && r.used != null && r.limit != null) {
      // Absolute request counts (Z.ai MCP monthly): real prompts, not %.
      const leftReq = Math.max(0, r.limit - r.used);
      const pct = r.used_percent;
      const bar = pct == null ? '' :
        '<div class="bar"><i class="' + barClass(pct) + '" style="width:' +
        Math.min(100, Math.max(0, pct)) + '%"></i>' +
        (paceExpected(r) != null ? '<i class="tick" style="left:' + Math.round(paceExpected(r) * 100) + '%"></i>' : '') +
        '</div>';
      body = '<div class="big">' + Math.round(r.used) + ' / ' + Math.round(r.limit) + '</div>' + bar +
        '<div class="resets">requests · quedan ' + Math.round(leftReq) +
        (r.resets_at ? ' · resets in ' + until(new Date(r.resets_at) - Date.now()) : '') + '</div>';
    } else {
      const pct = r.used_percent;
      const pctText = pct == null ? '—' : Math.round(pct) + '%';
      const exp = paceExpected(r);
      const tick = pct != null && exp != null
        ? '<i class="tick" style="left:' + Math.round(Math.min(100, exp * 100)) + '%"></i>'
        : '';
      const bar = pct == null ? '' :
        '<div class="bar"><i class="' + barClass(pct) + '" style="width:' +
        Math.min(100, Math.max(0, pct)) + '%"></i>' + tick + '</div>';
      let resets = '—';
      if (r.resets_at) {
        const t = new Date(r.resets_at);
        resets = 'resets in ' + until(t - Date.now()) + ' · ' +
          t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      if (exp != null) {
        resets += '<span class="xinfo"> · toca ' + Math.round(exp * 100) + '%' +
          (pct == null ? '' : ' · cierra ≈ ' + Math.min(999, Math.round(pct / exp)) + '%') +
          '</span>';
      }
      body = '<div class="big">' + pctText + '</div>' + bar +
             '<div class="resets">' + resets + '</div>';
    }
  }

  return '<div class="card ' + esc(r.state) + (muted ? ' done' : '') + '">' + title +
         '<div class="badges">' + badges + '</div>' +
         (resetDetailHtml ? '<div class="reset-detail hidden">' + resetDetailHtml + '</div>' : '') +
         body + note + '</div>';
}

function group(provider, recs) {
  recs.sort(cmpRecords);
  const main = recs.filter(r => isMainLabel(r.label));
  const other = recs.filter(r => !isMainLabel(r.label));
  const blocked = bindingTier(main);
  const name = (recs.find(r => r.display_name) || {}).display_name || provider;
  const pcts = recs.filter(r => typeof r.used_percent === 'number').map(r => r.used_percent);
  const pace = paceView(provider, recs);
  const sub = recs.length + (recs.length === 1 ? ' cuota' : ' cuotas') +
    (pcts.length ? ' · máx ' + Math.round(Math.max.apply(null, pcts)) + '%' : '') +
    (pace ? ' · ritmo ' + Math.min(999, Math.round(pace.pace * 100)) + '%' : '');

  let html = '<section class="group' + (blocked ? ' exhausted' : '') + '">' +
    '<div class="group-head"><span class="group-title">' + esc(name) + '</span>' +
    statusBadge(provider) +
    (blocked ? '<span class="badge state-done">agotada · ' + blocked + '</span>' : '') +
    sparkline(ritmoSeries(provider, HISTORY)) +
    '<span class="group-sub">' + esc(sub) + '</span></div>';
  // Cascade downward: windows FINER than the blocking tier are unusable too.
  const depth = blocked ? TIER_DEPTH[blocked] : null;
  const render = r => card(r, depth != null && r.state === 'ok' && windowTier(r.label) < depth ? blocked : null);
  if (main.length) {
    html += '<div class="cards">' + main.map(render).join('') + '</div>';
  }
  if (other.length) {
    if (main.length) html += '<div class="sub-head">Otras cuotas</div>';
    html += '<div class="cards">' + other.map(r => card(r)).join('') + '</div>';
  }
  return html + '</section>';
}

async function load(forceRefresh = false) {
  const btn = document.getElementById('btn-refresh');
  const btnIcon = document.getElementById('btn-icon');
  const btnText = document.getElementById('btn-text');

  if (forceRefresh && btn) {
    btn.disabled = true;
    btnIcon.classList.add('spin');
    btnText.textContent = 'Actualizando...';
  }

  try {
    // History powers weekly closes, sparklines and learned durations.
    try {
      const histResp = await fetch('/api/history');
      if (histResp.ok) HISTORY = (await histResp.json()).history || [];
    } catch { HISTORY = []; }
    LEARNED_DUR = learnDurations(HISTORY);

    const url = forceRefresh ? '/api/refresh' : '/api/quotas';
    // Incident state rides along with the quotas fetch; a /api/status
    // failure must never break quota rendering (badges just stay hidden).
    const [data, statusData, costsData] = await Promise.all([
      fetch(url).then(resp => {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
      }),
      fetch('/api/status').then(r => (r.ok ? r.json() : {})).catch(() => ({})),
      // A /api/costs failure must never break quota rendering.
      fetch('/api/costs').then(r => (r.ok ? r.json() : {})).catch(() => ({})),
    ]);
    STATUS = statusData.providers || {};
    COSTS = costsData;

    const groups = new Map();
    for (const r of data.records) {
      if (!groups.has(r.provider)) groups.set(r.provider, []);
      groups.get(r.provider).push(r);
    }
    const rank = recs => {
      const i = ORDER.indexOf(recs[0].provider);
      return i === -1 ? ORDER.length : i;
    };
    const ordered = [...groups.entries()].sort((a, b) =>
      rank(a[1]) - rank(b[1]) || a[0].localeCompare(b[0]));

    // Pace ranking: one unit-free number per sub (ritmo = your used % over
    // the elapsed window %). Most behind first — burn there so every window
    // closes near 100% (even spend). Clearly-ahead subs turn amber; blocked
    // ones sink gray. Capacity only breaks ties.
    const scored = ordered
      .map(([provider, recs]) => {
        const pace = paceView(provider, recs);
        if (!pace) return null;
        const name = (recs.find(r => r.display_name) || {}).display_name || provider;
        const main = recs.filter(r => isMainLabel(r.label));
        return { name, ...pace, blocked: bindingTier(main) };
      })
      .filter(Boolean)
      .sort((a, b) =>
        (a.blocked ? 1 : 0) - (b.blocked ? 1 : 0) ||
        a.pace - b.pace ||
        b.cap - a.cap);
    document.getElementById('ranking').innerHTML = scored.length
      ? '<span class="rank-label" title="ritmo = tu % usado / % de ventana transcurrida. Menos de 100% vas atrasado: gástala. Más de 100% vas adelantado: frena. A igual ritmo, antes la de más capacidad.">Ritmo semanal — gasta las más atrasadas:</span>' +
        scored.map((s, i) => {
          const ritmo = Math.min(999, Math.round(s.pace * 100));
          const tip = 'llevas ' + Math.round(s.usedPct) + '% · toca ' + Math.round(s.tocaPct) +
            '% → ritmo ' + ritmo + '% de la velocidad ideal (100% = clavado en la rayita)' +
            ' · cierre proyectado ' + Math.min(999, Math.round(s.usedPct / s.tocaPct * 100)) + '%' +
            (s.stale ? ' · dato de hace ' + ago(s.age).replace(/ ago$/, '') : '') +
            (s.blocked ? ' · bloqueada (' + s.blocked + ')' : '');
          const mini = '<span class="mini">' +
            '<i class="fill ' + barClass(s.usedPct) + '" style="width:' +
            Math.min(100, Math.max(0, s.usedPct)) + '%"></i>' +
            '<i class="tick" style="left:' + Math.round(Math.min(100, s.tocaPct)) + '%"></i>' +
            '</span>';
          return '<span class="chip' + (s.blocked ? ' done' : s.pace > 1.15 ? ' ahead' : '') +
            (s.stale ? ' stalemark' : '') +
            (!s.blocked && scored.findIndex(x => !x.blocked) === i ? ' best' : '') +
            '" title="' + esc(tip) + '"><b>' + esc(s.name) + '</b>' + mini +
            '<span class="w">ritmo ' + ritmo + '% · quedan ' + until(s.left) +
            (s.stale ? ' · visto hace ' + ago(s.age).replace(/ ago$/, '') : '') +
            (s.blocked ? ' · bloqueada (' + s.blocked + ')' : '') + '</span></span>';
        }).join('')
      : '';

    document.getElementById('groups').innerHTML =
      ordered.map(([provider, recs]) => group(provider, recs)).join('');

    // Weekly-close report: how full each sub ended its last completed week.
    const names = Object.fromEntries(ordered.map(([p, recs]) =>
      [p, (recs.find(r => r.display_name) || {}).display_name || p]));
    const closes = weeklyCloses(HISTORY)
      .map(c => ({ ...c, name: names[c.provider] || c.provider }))
      .sort((a, b) => b.close - a.close);
    document.getElementById('closes').innerHTML = closes.length
      ? '<span class="rank-label">Cierre de la semana anterior:</span>' +
        closes.map(c => '<span class="closechip"><b>' + esc(c.name) + '</b>' +
          Math.round(c.close) + '%</span>').join('')
      : '';
    renderCosts(data.records);

    document.getElementById('refreshed').textContent =
      'actualizado ' + new Date(data.generated_at).toLocaleTimeString();
    const lastUpdated = document.getElementById('last-updated');
    if (lastUpdated) {
      lastUpdated.textContent = 'last updated ' +
        new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
  } catch (e) {
    document.getElementById('refreshed').textContent = 'error: ' + e.message;
  } finally {
    if (btn) {
      btn.disabled = false;
      btnIcon.classList.remove('spin');
      btnText.textContent = 'Recargar';
    }
  }
}

// Adaptive precision: sub-cent usage must not render as "$0.00".
function fmtUsd(v) {
  if (v == null) return '\u2014';
  if (v >= 1) return '$' + v.toFixed(2);
  if (v >= 0.01) return '$' + v.toFixed(3);
  return '$' + v.toFixed(4);
}

// Human names for provider slugs (cost breakdown rows).
const PROV_NAMES = {
  anthropic: 'Anthropic', openai: 'OpenAI', google: 'Google', deepseek: 'DeepSeek',
  'zai-coding-plan': 'Z.ai (plan)', 'opencode-go': 'OpenCode Go', opencode: 'OpenCode',
};

// OpenCode spend panel (inspired by OpenRouter / Anthropic Console usage
// views): range selector, big totals with paid/covered split, daily bars,
// provider accordions with per-model detail. The server exposes ONLY
// opencode rows: {d, m, billed, covered} in USD.
const costRange = { sel: localStorage.getItem('costRange') || 'month' };

function costRangeBounds(kind) {
  const now = new Date();
  const iso = d => d.toISOString().slice(0, 10);
  if (kind === '30d') {
    const from = new Date(now); from.setDate(now.getDate() - 29);
    return [iso(from), null];
  }
  if (kind === 'prev') {
    const from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const to = new Date(now.getFullYear(), now.getMonth(), 0);
    return [iso(from), iso(to)];
  }
  if (kind === 'all') return [null, null];
  return [iso(new Date(now.getFullYear(), now.getMonth(), 1)), null];
}

function setCostRange(sel) {
  costRange.sel = sel;
  localStorage.setItem('costRange', sel);
  load(false);
}

function toggleCostDetail(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden');
}

function renderCosts(records) {
  const el = document.getElementById('costs');
  const oc = (COSTS && COSTS.providers && COSTS.providers.opencode) || null;
  if (!oc) { el.innerHTML = ''; return; }

  const [from, to] = costRangeBounds(costRange.sel);
  const rows = (oc.rows || []).filter(r => (!from || r.d >= from) && (!to || r.d <= to));

  // Totals: paid (billed) vs covered by subscriptions (valued at catalog).
  let paid = 0, covered = 0;
  const byProv = new Map(), byModel = new Map(), byDay = new Map();
  for (const r of rows) {
    const total = (r.billed || 0) + (r.covered || 0);
    paid += r.billed || 0;
    covered += r.covered || 0;
    const prov = r.m.includes('/') ? r.m.slice(0, r.m.indexOf('/')) : r.m;
    if (!byProv.has(prov)) byProv.set(prov, { paid: 0, covered: 0 });
    const p = byProv.get(prov); p.paid += r.billed || 0; p.covered += r.covered || 0;
    if (!byModel.has(r.m)) byModel.set(r.m, { paid: 0, covered: 0 });
    const m = byModel.get(r.m); m.paid += r.billed || 0; m.covered += r.covered || 0;
    byDay.set(r.d, (byDay.get(r.d) || 0) + total);
  }
  const total = paid + covered;
  const monthTotal = Math.max(0.0001, total);

  // Daily bars.
  const dayEntries = [...byDay.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const maxDay = Math.max(0.0001, ...dayEntries.map(([, v]) => v));
  const bars = dayEntries.map(([day, v]) => {
    const h = Math.max(3, Math.round(v / maxDay * 56));
    const label = new Date(day + 'T12:00:00').toLocaleDateString([], { day: '2-digit', month: 'short' });
    return '<i style="height:' + h + 'px" title="' + esc(label) + ' — ' + fmtUsd(v) + '"></i>';
  }).join('');

  // Provider accordion rows (sorted by total desc).
  const provRows = [...byProv.entries()].sort((a, b) =>
    (b[1].paid + b[1].covered) - (a[1].paid + a[1].covered)).map(([prov, s], i) => {
    const sub = s.paid + s.covered;
    const share = Math.round(sub / monthTotal * 100);
    const name = PROV_NAMES[prov] || prov;
    const split = s.paid > 0
      ? fmtUsd(sub) + ' · ' + share + '%'
      : fmtUsd(sub) + ' · ' + share + '% (plan)';
    const modelRows = [...byModel.entries()]
      .filter(([m]) => (m.includes('/') ? m.slice(0, m.indexOf('/')) : m) === prov)
      .sort((a, b) => (b[1].paid + b[1].covered) - (a[1].paid + a[1].covered))
      .map(([m, s2]) => {
        const modelName = m.includes('/') ? m.slice(m.indexOf('/') + 1) : m;
        const tag = s2.paid > 0 && s2.covered > 0 ? 'pagada ' + fmtUsd(s2.paid) + ' · cubierta ' + fmtUsd(s2.covered)
          : s2.paid > 0 ? 'pagada' : 'cubierto por plan';
        return '<div class="note">' + esc(modelName) + ' — ' + fmtUsd(s2.paid + s2.covered) +
          ' <span style="opacity:.7">(' + tag + ')</span></div>';
      }).join('');
    return '<div class="prov-row">' +
      '<div class="qrow-top prov-head" onclick="toggleCostDetail(\'pcd-' + i + '\')">' +
        '<span class="title">' + esc(name) + ' ▸</span>' +
        '<strong class="qval">' + split + '</strong></div>' +
      '<div class="bar"><i class="green" style="width:' + Math.min(100, share) + '%"></i></div>' +
      '<div id="pcd-' + i + '" class="cdetail hidden">' + modelRows + '</div>' +
      '</div>';
  }).join('');

  // Real out-of-pocket: extra-credit consumption billed on top of the sub.
  let realLine = '';
  const extra = (records || []).find(r => r.provider === 'claude' && r.kind === 'balance');
  if (extra && extra.used != null && extra.limit != null) {
    const sym = SYMBOLS[extra.currency] || extra.currency || '';
    realLine = '<div class="prov-row"><div class="qrow-top">' +
      '<span class="title">Gasto real — créditos extra Claude</span>' +
      '<strong class="qval">' + sym + Number(extra.used).toFixed(2) + ' / ' +
      Number(extra.limit).toFixed(2) + '</strong></div>' +
      '<div class="bar"><i class="red" style="width:' +
      Math.min(100, extra.used / extra.limit * 100) + '%"></i></div></div>';
  }

  const btn = (id, label) => '<button class="range-btn' + (costRange.sel === id ? ' on' : '') +
    '" onclick="setCostRange(\'' + id + '\')">' + label + '</button>';

  el.innerHTML =
    '<section class="group cost-panel">' +
      '<div class="group-head"><span class="group-title">Coste OpenCode</span>' +
      '<span class="group-sub">valor de catálogo models.dev</span>' +
      '<span style="margin-left:auto">' +
        btn('month', 'este mes') + btn('prev', 'mes pasado') +
        btn('30d', '30 días') + btn('all', 'todo') +
      '</span></div>' +
      '<div class="card">' +
        '<div class="cost-grid">' +
          '<div><div class="qrow-top"><span class="title">total del rango</span>' +
            '<strong class="qval" style="font-size:20px">' + fmtUsd(total) + '</strong></div>' +
            '<div class="split-line">pagado <b class="pagado">' + fmtUsd(paid) + '</b>' +
            ' · cubierto por subs <b class="cubierto">' + fmtUsd(covered) + '</b></div>' +
            '<div class="cost-days">' + (bars || '<i class="zero" style="height:3px"></i>') + '</div></div>' +
          '<div><div class="qrow-top"><span class="title">hoy</span>' +
            '<strong class="qval" style="font-size:20px">' + fmtUsd(oc.today_usd) + '</strong></div>' +
            '<div class="note" style="margin-top:10px">click en un proveedor para ver el desglose por modelo. ' +
            'El uso de tus planes se valora a catálogo pero no es dinero pagado.</div></div>' +
        '</div>' +
        provRows + realLine +
      '</div>' +
    '</section>';
}

function triggerRefresh() {
  load(true);
}

// E13: workday-aware pace toggle (persisted; re-renders from cached data).
function toggleWorkday() {
  workday.on = !workday.on;
  localStorage.setItem('workdayPace', workday.on ? '1' : '0');
  syncWorkdayButton();
  load(false);
}

function syncWorkdayButton() {
  const btn = document.getElementById('btn-workday');
  if (btn) {
    btn.textContent = 'ritmo laborable: ' + (workday.on ? 'on' : 'off');
    btn.classList.toggle('on', workday.on);
    btn.title = 'Al activarlo, el "toca" solo cuenta horas de lunes a viernes dentro de cada ventana.';
  }
}

// Compact-by-default detail toggle: hides toca/cierra and notes (pure CSS).
const moreinfo = { on: localStorage.getItem('moreInfo') === '1' };

function toggleMoreInfo() {
  moreinfo.on = !moreinfo.on;
  localStorage.setItem('moreInfo', moreinfo.on ? '1' : '0');
  syncMoreInfoButton();
}

function syncMoreInfoButton() {
  const btn = document.getElementById('btn-moreinfo');
  if (btn) {
    btn.textContent = 'más info: ' + (moreinfo.on ? 'on' : 'off');
    btn.classList.toggle('on', moreinfo.on);
    btn.title = 'Muestra "toca / cierra ≈" y las notas de detalle (plan level, desgloses, motivos de fallo) en las cards.';
  }
  if (document.body) document.body.classList.toggle('moreinfo', moreinfo.on);
}

// Auto-refresh: reload /api/quotas every minute while enabled (same cached
// fetch + render path as the manual button, just periodic). Persisted like
// the other toggles.
// Randomized cadence (10-30 min) so the dashboard never hammers the API
// on a predictable beat; each cycle schedules the next one.
const AUTOREFRESH_MIN_MS = 10 * 60_000;
const AUTOREFRESH_MAX_MS = 30 * 60_000;
const autorefresh = { on: localStorage.getItem('autoRefresh') === '1', timer: null };

function toggleAutoRefresh() {
  setAutoRefresh(!autorefresh.on);
}

// Start/stop the periodic reload and persist the choice.
function setAutoRefresh(on) {
  autorefresh.on = on;
  localStorage.setItem('autoRefresh', on ? '1' : '0');
  if (autorefresh.timer) {
    clearTimeout(autorefresh.timer);
    autorefresh.timer = null;
  }
  if (on) scheduleAutoRefresh();
  syncAutoRefreshButton();
}

function nextAutoRefreshDelay() {
  return AUTOREFRESH_MIN_MS + Math.random() * (AUTOREFRESH_MAX_MS - AUTOREFRESH_MIN_MS);
}

function scheduleAutoRefresh() {
  autorefresh.timer = setTimeout(() => {
    load(false).finally(scheduleAutoRefresh);
  }, nextAutoRefreshDelay());
}

function syncAutoRefreshButton() {
  const btn = document.getElementById('btn-autorefresh');
  if (btn) {
    btn.textContent = 'auto-refresh: ' + (autorefresh.on ? 'on' : 'off');
    btn.classList.toggle('on', autorefresh.on);
    btn.title = 'Recarga los datos automáticamente cada 10-30 minutos (intervalo aleatorio).';
  }
}

// Initial load (from cache / state dir only; periodic reloads only when the
// user turned auto-refresh on)
syncMoreInfoButton();
syncWorkdayButton();
setAutoRefresh(autorefresh.on);
load(false);
</script>
