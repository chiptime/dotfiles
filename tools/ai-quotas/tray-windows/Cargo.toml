[package]
name = "ai-quotas-tray"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ai-quotas-tray"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
