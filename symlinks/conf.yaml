- clean: ['~']

- defaults:
    link:
      create: true
      force: true

- link:
    ~/.gitignore_global: git/.gitignore_global
    ~/.bash_profile: shell/bash/.bash_profile
    ~/.bashrc: shell/bash/.bashrc
    ~/.zimrc: shell/zsh/.zimrc
    ~/.zlogin: shell/zsh/.zlogin
    ~/.zshenv: shell/zsh/.zshenv
    ~/.zshrc: shell/zsh/.zshrc
    ~/.vimrc: editors/vim/.vimrc
    ~/.vim/colors/dark-redux.vim: editors/vim/themes/dark-redux.vim
    ~/.config/nvim: editors/nvim
    ~/.config/opencode/commands/notion-backlog.md: ai/agents/opencode/commands/notion-backlog.md
    ~/.config/opencode/skills/antigravity-explore: ai/agents/opencode/skills/antigravity-explore
    ~/.config/ai-stack/opencode-router.json: ai/opencode-router/opencode-router.json
    ~/.local/bin/opencode-web: ai/opencode-router/bin/opencode-web.sh
