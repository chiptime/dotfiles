- clean: ['~']

- defaults:
    link:
      create: true
      force: true

- link:
    ~/.gitignore_global: git/.gitignore_global
    ~/.bash_profile: shell/bash/.bash_profile
    ~/.bashrc: shell/bash/.bashrc
    ~/.zimrc: shell/zsh/.zimrc
    ~/.zlogin: shell/zsh/.zlogin
    ~/.zshenv: shell/zsh/.zshenv
    ~/.zshrc: shell/zsh/.zshrc
    ~/.vimrc: editors/vim/.vimrc
    ~/.vim/colors/dark-redux.vim: editors/vim/themes/dark-redux.vim
    ~/.config/nvim: editors/nvim
    ~/.config/opencode/commands/notion-backlog.md: ai/agents/opencode/commands/notion-backlog.md
    # antigravity-explore skill: NOT dotbot-managed. OpenCode's skill scanner
    # (Bun glob, followSymlinks=false) ignores symlinked SKILL.md files, so it
    # must be a HARDLINK to the dotfiles source:
    #   ln -f ~/.dotfiles/ai/agents/opencode/skills/antigravity-explore/SKILL.md \
    #     ~/.config/opencode/skills/antigravity-explore/SKILL.md
    # (re-run after editors that write-replace, which break the link)
    # Rendered router config is NOT dotbot-managed: ai/opencode-router/build.sh
    # deploys a REAL copy to ~/.config/ai-stack/opencode-router.json. Do NOT
    # restore a symlink here: on 2026-09-08 an in-place runtime rewrite (ad-hoc
    # model-fix) wrote through the symlink into the tracked rendered file,
    # reformatting it and injecting a top-level "model" field. Copies only.
    ~/.local/bin/opencode-web: ai/opencode-router/bin/opencode-web.sh
